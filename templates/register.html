<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Career Compass AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="fa-solid fa-graduation-cap"></i>
            Career Compass AI
        </a>
    </div>
</nav>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg">

<div class="card-body">

<h2 class="text-center text-primary mb-4">

Create Your Account

</h2>

<form action="/register" method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label>Full Name</label>
<input type="text" class="form-control" name="name" required>
</div>

<div class="col-md-6 mb-3">
<label>Email</label>
<input type="email" class="form-control" name="email" required>
</div>

<div class="col-md-6 mb-3">
<label>Password</label>
<input type="password" class="form-control" name="password" required>
</div>

<div class="col-md-6 mb-3">
<label>Confirm Password</label>
<input type="password" class="form-control" name="confirm_password" required>
</div>

<div class="col-md-6 mb-3">
<label>Age</label>
<input type="number" class="form-control" name="age">
</div>

<div class="col-md-6 mb-3">
<label>Gender</label>
<select class="form-select" name="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>College</label>
<input type="text" class="form-control" name="college">
</div>

<div class="col-md-6 mb-3">
<label>Degree</label>
<input type="text" class="form-control" name="degree">
</div>

<div class="col-md-6 mb-3">
<label>Branch</label>
<input type="text" class="form-control" name="branch">
</div>

<div class="col-md-6 mb-3">
<label>Current Year</label>
<select class="form-select" name="year">
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
<option>Graduate</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>CGPA</label>
<input type="text" class="form-control" name="cgpa">
</div>

<div class="col-md-6 mb-3">
<label>Dream Company</label>
<input type="text" class="form-control" name="company">
</div>

<div class="col-12 mb-3">
<label>Skills</label>
<textarea class="form-control" rows="2" name="skills"
placeholder="Python, Java, HTML, SQL"></textarea>
</div>

<div class="col-12 mb-3">
<label>Interests</label>
<textarea class="form-control" rows="2" name="interests"
placeholder="AI, Web Development, Cyber Security"></textarea>
</div>

<div class="col-md-6 mb-3">
<label>Preferred Work Mode</label>
<select class="form-select" name="workmode">
<option>Remote</option>
<option>Hybrid</option>
<option>Office</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Career Goal</label>
<select class="form-select" name="goal">
<option>Software Engineer</option>
<option>AI Engineer</option>
<option>Data Scientist</option>
<option>Cyber Security Analyst</option>
<option>Cloud Engineer</option>
<option>UI/UX Designer</option>
</select>
</div>

</div>

<div class="d-grid mt-3">

<button class="btn btn-primary btn-lg">

<i class="fa-solid fa-user-plus"></i>

Register

</button>

</div>

<div class="text-center mt-3">

Already have an account?

<a href="/login">

Login Here

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
